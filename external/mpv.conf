# Base mpv config for Live Lock Screen.
# Loaded with --no-config --include=<this file> --profile=<quality|balanced|efficient>,
# so user configs in ~/.config/mpv are never applied.
#
# Options the player logic depends on (pause, keep-open, loop, IPC socket,
# volume, transparency) are passed from MpvPlayerProcess instead,
# so neither this file nor custom arguments can break them.
keepaspect=no
border=no
title=LiveLockScreen

hwdec=auto-safe
stop-screensaver=no
osd-level=0
terminal=no
msg-level=all=no

# Prevents audio artifacts on fade
audio-buffer=0.1

[quality]
profile-desc=Best image quality, higher GPU usage
# Trailing comma: fall back on any other available video output
vo=gpu-next,gpu,

[balanced]
profile-desc=Same video output as quality with cheaper scaling, supports transparency
# Trailing comma: fall back on any other available video output
vo=gpu-next,gpu,
profile=fast

[efficient]
profile-desc=Lower GPU usage, no transparency support
# Trailing comma: fall back on any other available video output
vo=dmabuf-wayland,gpu-next,gpu,
profile=fast
